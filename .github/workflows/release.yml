name: Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: password-saver-linux-x64
            asset_name: password-saver_${{ github.ref_name }}_amd64.deb
          - platform: linux
            target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: password-saver-windows-x64
            asset_name: password-saver_${{ github.ref_name }}_x64-setup.exe
          - platform: darwin
            target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: password-saver-macos-x64
            asset_name: password-saver_${{ github.ref_name }}_x64.dmg
          - platform: darwin
            target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: password-saver-macos-arm64
            asset_name: password-saver_${{ github.ref_name }}_arm64.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Password Saver ${{ github.ref_name }}
          releaseBody: See the changelog for details on this release.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true
          updaterJsonCompression: gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Password Saver ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: |
            ## Password Saver ${{ github.ref_name }}
            
            A new release of Password Saver is available!
            
            ### Downloads
            - **Windows**: [password-saver_${{ github.ref_name }}_x64-setup.exe](https://github.com/emilnordstroem/password-saver/releases/download/${{ github.ref_name }}/password-saver_${{ github.ref_name }}_x64-setup.exe)
            - **macOS (Intel)**: [password-saver_${{ github.ref_name }}_x64.dmg](https://github.com/emilnordstroem/password-saver/releases/download/${{ github.ref_name }}/password-saver_${{ github.ref_name }}_x64.dmg)
            - **macOS (Apple Silicon)**: [password-saver_${{ github.ref_name }}_arm64.dmg](https://github.com/emilnordstroem/password-saver/releases/download/${{ github.ref_name }}/password-saver_${{ github.ref_name }}_arm64.dmg)
            - **Linux**: [password-saver_${{ github.ref_name }}_amd64.deb](https://github.com/emilnordstroem/password-saver/releases/download/${{ github.ref_name }}/password-saver_${{ github.ref_name }}_amd64.deb)
            
            ### Changes
            See [CHANGELOG.md](https://github.com/emilnordstroem/password-saver/blob/${{ github.ref_name }}/CHANGELOG.md) for details.
          files: |
            artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
